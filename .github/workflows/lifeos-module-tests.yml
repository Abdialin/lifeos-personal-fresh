name: LifeOS Personal isolated module tests
on:
  push:
    branches: [main]
    paths:
      - 'personal_social_isolated_v114.py'
      - 'personal_account_workspace_v115.py'
      - 'test_account_workspace_v115.py'
      - 'personal_account_api_v117.py'
      - 'test_account_api_v117.py'
      - 'personal_account_http_v117.py'
      - 'test_account_http_v117.py'
      - 'test_account_friends_http_v118.py'
      - 'personal_account_friends_v118.js'
      - 'personal_account_migration_v119.py'
      - 'personal_account_migration_v119.js'
      - 'test_account_migration_v119.py'
      - 'server.py'
      - 'test_social_isolated_v114.py'
      - 'personal_debt_cancellation_v102.js'
      - 'personal_debt_recovery_v75.js'
      - 'personal_exercise_progress_v100.js'
      - 'personal_core_completion_v110.js'
      - 'personal_exercise_transfer_v105.js'
      - 'personal_preferences_hub_v88.js'
      - 'personal_preferences_sync_v89.js'
      - 'personal_exercise_plans_v95.js'
      - 'test_*.test.cjs'
      - 'test_today_structure_v120.cjs'
      - 'test_today_visual_v121.cjs'
      - 'personal_today_visual_refresh_v121.css'
      - 'personal_today_design_v122.js'
      - 'personal_today_design_v122.css'
      - 'test_today_design_v122.test.cjs'
      - 'personal_today_ladder_v123.css'
      - 'test_today_ladder_v123.test.cjs'
      - 'personal_today_upcoming_v124.css'
      - 'test_today_upcoming_v124.test.cjs'
      - 'personal_today_hero_v125.css'
      - 'test_today_hero_v125.test.cjs'
      - 'personal_track_design_v126.js'
      - 'personal_track_design_v126.css'
      - 'test_track_design_v126.test.cjs'
      - 'personal_track_focus_v127.js'
      - 'personal_track_focus_v127.css'
      - 'test_track_focus_v127.test.cjs'
      - 'personal_track_polish_v128.js'
      - 'personal_track_polish_v128.css'
      - 'test_track_polish_v128.test.cjs'
      - 'personal_reminder_experience_v16.js'
      - 'personal_visual_intelligence_v4.js'
      - 'index.html'
      - '.github/workflows/lifeos-module-tests.yml'
  workflow_dispatch:
jobs:
  isolated-domain-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python isolated Friends tests
        run: python -m unittest -v test_social_isolated_v114.py test_account_workspace_v115.py test_account_api_v117.py test_account_http_v117.py test_account_friends_http_v118.py test_account_migration_v119.py
      - name: Today read-only layout checks
        run: node test_today_structure_v120.cjs && node test_today_visual_v121.cjs && node --test test_today_design_v122.test.cjs && node --test test_today_ladder_v123.test.cjs && node --test test_today_upcoming_v124.test.cjs && node --test test_today_hero_v125.test.cjs && node --test test_track_design_v126.test.cjs && node --test test_track_focus_v127.test.cjs && node --test test_track_polish_v128.test.cjs
      - name: JavaScript isolated module regression tests
        run: node --test test_debt_cancellation_v102.test.cjs test_preferences_v104.test.cjs test_exercise_transfer_v105.test.cjs test_core_completion_v110.test.cjs test_account_friends_v118.test.cjs test_account_migration_v119.test.cjs
