name: LifeOS Android companion compile (experimental)
on:
  push:
    branches: [main]
    paths:
      - 'android-companion/**'
      - '.github/workflows/personal-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null || test ${PIPESTATUS[0]} -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile companion debug APK (no signing/distribution)
        working-directory: android-companion
        run: gradle :app:assembleDebug --no-daemon --stacktrace
