name: LifeOS Android beta APK verification (V245)
on:
  push:
    branches: [today-a-plus-rebuild]
    paths:
      - 'android-companion/**'
      - '.github/workflows/personal-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect optional persistent signing configuration (never print secrets)
        id: signing
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.LIFEOS_BETA_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.LIFEOS_BETA_STORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.LIFEOS_BETA_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.LIFEOS_BETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGNING_KEYSTORE" && -n "$SIGNING_STORE_PASSWORD" &&
                -n "$SIGNING_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            umask 077
            keypath="$RUNNER_TEMP/lifeos-beta-signing.p12"
            printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$keypath"
            test -s "$keypath"
            echo "LIFEOS_SIGNING_STORE_FILE=$keypath" >> "$GITHUB_ENV"
            echo "LIFEOS_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "LIFEOS_SIGNING_KEY_ALIAS=$SIGNING_ALIAS" >> "$GITHUB_ENV"
            echo "LIFEOS_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Stable beta signing is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Stable signing secrets are incomplete. Preview build will stop."
          fi

      - name: Build permanently signed side-by-side Preview APK
        working-directory: android-companion
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.signing.outputs.ready }}" = "true"
          # Build a separately identified, persistently signed Preview.
          sed -i 's/applicationId = "com.lifeos.companion.beta"/applicationId = "com.lifeos.companion.beta.preview.stable"/' app/build.gradle.kts
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee ../android-v245-build.log

      - name: Verify signed Preview APK and independent package ID
        shell: bash
        run: |
          set -euo pipefail
          apk="android-companion/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -3
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" | tee android-v245-dev-package.txt
          grep -q "package: name='com.lifeos.companion.beta.preview.stable'" android-v245-dev-package.txt
          grep -q "sdkVersion:'26'" android-v245-dev-package.txt
          grep -q "targetSdkVersion:'35'" android-v245-dev-package.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > android-v245-dev-cert.txt
          echo "Verified separate persistently signed Preview package."

      - name: Build persistently signed beta APK (only when secrets exist)
        if: ${{ false }}
        working-directory: android-companion
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee ../android-v245-signed-build.log

      - name: Verify stable beta APK and certificate
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          apk="android-companion/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -3
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" | tee android-v245-beta-package.txt
          grep -q "package: name='com.lifeos.companion.beta'" android-v245-beta-package.txt
          grep -q "sdkVersion:'26'" android-v245-beta-package.txt
          grep -q "targetSdkVersion:'35'" android-v245-beta-package.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee android-v245-beta-cert.txt
          echo "Verified stable-signature beta package. Compare this certificate SHA-256 across future releases."

      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-android-v245-build-diagnostics
          path: |
            android-v245-build.log
            android-v245-signed-build.log
            android-v245-dev-package.txt
            android-v245-dev-cert.txt
            android-v245-beta-package.txt
            android-v245-beta-cert.txt
            android-companion/app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain permanently signed Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-android-v245-signed-preview
          path: android-companion/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Retain stable signed BETA APK (safe future upgrades with same key)
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-android-v245-signed-beta
          path: android-companion/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lifeos-beta-signing.p12"
