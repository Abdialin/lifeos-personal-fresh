name: LifeOS Android companion APK verification (V233)
on:
  push:
    branches: [main]
    paths:
      - 'android-companion/**'
      - '.github/workflows/personal-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK missing: $SDK_ROOT"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT: $SDK_ROOT"
          java -version
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile experimental V233 Android debug APK
        working-directory: android-companion
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ../android-v233-build.log
      - name: Verify APK archive and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android-companion/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::APK missing or empty"; exit 1; }
          unzip -t "$APK" | tail -3
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee android-v233-package-info.txt
          grep -q "package: name='com.lifeos.companion'" android-v233-package-info.txt
          grep -q "sdkVersion:'26'" android-v233-package-info.txt
          grep -q "targetSdkVersion:'35'" android-v233-package-info.txt
          echo "APK passed archive, package ID, minSdk, targetSdk checks"
      - name: Save build and validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-android-v233-build-diagnostics
          path: |
            android-v233-build.log
            android-v233-package-info.txt
            android-companion/app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified debug APK for private testing
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-android-v233-debug-test-only
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
