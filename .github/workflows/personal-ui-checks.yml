name: LifeOS Personal UI checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personal-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static asset routes
        run: node test_static_asset_routes.cjs
      - name: Validate full HTML-linked frontend asset allowlist
        run: python3 test_frontend_static_assets_v236.py
      - name: Validate navigation reuse
        run: node test_unified_navigation_reuse.cjs
      - name: Validate Fitness to Goals evidence
        run: node test_goal_fitness_cross_section_v204.cjs
      - name: Validate cross-section record integrity
        run: node test_cross_section_integrity_v206.cjs
      - name: Validate strict whole-workspace cloud parity
        run: node test_cloud_parity_v210.cjs
      - name: Validate recovery bundle import and fail-closed backup formats
        run: node test_recovery_import_v218.cjs
      - name: Validate offline queue revision safety
        run: node test_sync_gate_v211.cjs
      - name: Validate two-device conflict review
        run: node test_conflict_plan_v212.cjs
      - name: Validate safe selective reconciliation
        run: node test_reconcile_guard_v213.cjs
      - name: Validate browser phone timer shortcut
        run: node test_timer_shortcut_v220.cjs
      - name: Validate native Android timer state projection
        run: node test_android_bridge_v222.cjs
      - name: Validate native notification pause and resume safety
        run: node test_android_bridge_v228.cjs
      - name: Validate native WebView background-to-foreground timer refresh
        run: node test_android_bridge_v231.cjs
      - name: Validate native alarm and timer service lifecycle safeguards
        run: node test_android_lifecycle_v231.cjs
      - name: Validate native Android diagnostic and lock-screen privacy source
        run: node test_android_companion_v230.cjs
      - name: Validate first-run empty workspace safety and Android system-bar layout
        run: node test_android_first_run_v233.cjs
      - name: Validate safe fresh-device cloud adoption and verified Android backups
        run: node test_fresh_device_adoption_v234.cjs
      - name: Validate encrypted native sync token and capability handshake
        run: node test_native_secure_sync_v237.cjs
      - name: Validate side-by-side Android beta and stable signing configuration
        run: node test_android_signing_v238.cjs
      - name: Validate Android-safe recovery confirmation and unchanged backup gates
        run: node test_android_restore_confirmation_v239.cjs
      - name: Validate Samsung navigation bar clearance and touch target layout
        run: node test_android_navigation_safe_v240.cjs
      - name: Validate browser-only activity recovery and timestamp preservation
        run: node test_browser_activity_recovery_v241.cjs
      - name: Validate additive browser-to-server and server-to-beta reconciliation
        run: node test_activity_delta_sync_v242.cjs
      - name: Validate Android JSON picker and browser date inventory
        run: node test_android_file_picker_v243.cjs
      - name: Validate pending Android queue safe reconciliation and backups
        run: node test_pending_queue_recovery_v244.cjs
      - name: Validate explicit per-record local/server conflict reconciliation
        run: node test_conflict_resolution_v245.cjs
      - name: Validate beta-primary cloud health check has no write path
        run: node test_beta_primary_sync_v246.cjs
      - name: Validate read-only tracked and unique time quality audit
        run: node test_tracking_quality_v247.cjs
      - name: Validate paused/resumed open timer timeline is read-only
        run: node test_timer_history_v248.cjs
      - name: Validate actionable timer review and canonical pause/resume/finish
        run: node test_timer_decisions_v249.cjs
      - name: Validate substantial pause/resume intervals without double counting
        run: node test_activity_pauses_v225.cjs
      - name: Validate focus control states and alert engine
        run: node test_focus_alert_v221.cjs
      - name: Validate new activity feedback features
        run: |
          node test_lifeos_feedback_v207.cjs
          node test_focus_alarm_v207.cjs
          node test_weekly_averages_v208.cjs
          node test_activity_insights_v209.cjs
      - name: Validate visual integration
        run: node test_visual_intelligence_v4.cjs
      - name: Validate planner and reality comparisons
        run: |
          node test_planner_safety.cjs
          node test_day_type_patterns.cjs
          node test_historical_suggestions.cjs
          node test_plan_reality_alignment.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate actual runtime and six navigation areas
        run: python test_runtime_smoke_v206.py
      - name: Verify V208 feedback controls in Chromium
        run: timeout --signal=TERM 110s python -m unittest -v test_feedback_v208_browser
      - name: Verify two real browser contexts against isolated sync backend
        run: timeout --signal=TERM 100s python -m unittest -v test_two_browser_cas_v214
      - name: Verify isolated SQLite activity records survive backend restart
        run: timeout --signal=TERM 50s python -m unittest -v test_sync_restart_v215
      - name: Verify actual app offline queue and reconnection
        run: timeout --signal=TERM 100s python -m unittest -v test_offline_reconnect_v216
      - name: Verify recovery bundle export and restore in isolated Chromium
        run: timeout --signal=TERM 90s python -m unittest -v test_recovery_roundtrip_v218_browser
      - name: Verify isolated backend storage probe
        run: python -m unittest -v test_storage_status_probe
      - name: Verify browser notification opt-in and removal
        run: timeout --signal=TERM 70s python -m unittest -v test_timer_shortcut_v220_browser
      - name: Verify focus pause break and alarm controls in Chromium
        run: timeout --signal=TERM 95s python -m unittest -v test_focus_controls_v221_browser
      - name: Verify restricted Android bridge timer and alarm events
        run: timeout --signal=TERM 80s python -m unittest -v test_android_bridge_v222_browser
      - name: Verify current six-section LifeOS interface
        run: timeout --signal=TERM 150s python -m unittest -v test_current_personal_v219_browser
      - name: Historical v4 UI compatibility (diagnostic; older layout assertions)
        id: legacy-ui
        continue-on-error: true
        run: timeout --signal=TERM 540s python -m unittest -v test_personal_v4_browser
      - name: Report historical compatibility status explicitly
        if: always()
        run: |
          echo "Historical v4 compatibility step: ${{ steps.legacy-ui.outcome }}"
          if [ "${{ steps.legacy-ui.outcome }}" != "success" ]; then
            echo "::warning::Historical v4 UI tests have unresolved failures; do not classify them as passed."
          fi
      - name: Upload mobile and desktop UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-personal-ui-screenshots
          path: artifacts/ui/*.png
          if-no-files-found: ignore
          retention-days: 14
