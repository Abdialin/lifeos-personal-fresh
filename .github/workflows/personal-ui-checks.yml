name: LifeOS Personal UI checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personal-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static asset routes
        run: node test_static_asset_routes.cjs
      - name: Validate navigation reuse
        run: node test_unified_navigation_reuse.cjs
      - name: Validate visual integration
        run: node test_visual_intelligence_v4.cjs
      - name: Validate planner and reality comparisons
        run: |
          node test_planner_safety.cjs
          node test_day_type_patterns.cjs
          node test_historical_suggestions.cjs
          node test_plan_reality_alignment.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test actual LifeOS Personal UI in Chromium
        run: python -m unittest -v test_personal_v4_browser
      - name: Upload mobile and desktop UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-personal-ui-screenshots
          path: artifacts/ui/*.png
          if-no-files-found: ignore
          retention-days: 14
