name: Today A+ mobile visual verification
on:
  push:
    branches: [today-a-plus-rebuild]
  workflow_dispatch:
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture actual branch interface
        run: |
          python3 -m http.server 8765 > /tmp/lifeos-http.log 2>&1 &
          mkdir -p visual-results
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const width of [360,393,412]) for(const theme of ['dark','light']){
              const page=await browser.newPage({viewport:{width,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const errors=[];page.on('pageerror',e=>errors.push(e.stack||e.message));
              await page.goto('http://127.0.0.1:8765/index.html?todayDemo=1',{waitUntil:'load'});
              await page.waitForTimeout(2500);
              if(theme==='light')await page.locator('#todayAPlus .ap-header button').click();
              for(const [i,name] of ['Overview','Timeline','Agenda','Review','Track'].entries()){
                if(i===4)await page.locator('#lifeosNavigation [data-view="tracking"]').click();
                else await page.locator('#apTab'+i).click();
                await page.evaluate(()=>window.scrollTo(0,0));
                await page.waitForTimeout(250);
                await page.screenshot({path:'visual-results/'+width+'-'+theme+'-'+name+'-top.png'});
                const metrics=await page.evaluate(({i})=>{
                  const root=document.querySelector('#todayAPlus'),nav=document.querySelector('#lifeosNavigation'),panel=document.querySelector('#apPage'+i);
                  const visible=e=>!!e&&e.getClientRects().length>0&&getComputedStyle(e).visibility!=='hidden';
                  return {horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1,rootVisible:visible(root),visibleTodayPanels:[...document.querySelectorAll('#todayAPlus .ap-page')].filter(visible).length,trackVisible:visible(document.querySelector('#loTrackConceptA')),warningVisible:visible(root?.querySelector('.ap-note')),navHeight:nav?.getBoundingClientRect().height,headerHeight:document.querySelector('header.top')?.getBoundingClientRect().height,panelHeight:panel?.getBoundingClientRect().height};
                },{i});
                await page.screenshot({path:'visual-results/'+width+'-'+theme+'-'+name+'-full.png',fullPage:true});
                await page.evaluate(()=>window.scrollTo(0,document.documentElement.scrollHeight));
                await page.waitForTimeout(200);
                await page.screenshot({path:'visual-results/'+width+'-'+theme+'-'+name+'-bottom.png'});
                const bottom=await page.evaluate(({i})=>{
                  const panel=document.querySelector('#apPage'+i),nav=document.querySelector('#lifeosNavigation');
                  return panel&&nav?{panelBottom:panel.getBoundingClientRect().bottom,navTop:nav.getBoundingClientRect().top}:null;
                },{i});
                const pass=errors.length===0&&!metrics.horizontalOverflow&&(i===4?!metrics.rootVisible:metrics.rootVisible&&metrics.visibleTodayPanels===1&&!metrics.trackVisible&&metrics.warningVisible&&bottom.panelBottom<=bottom.navTop+2&&bottom.navTop-bottom.panelBottom<=32);
                results.push({width,theme,name,metrics,bottom,pass,errors:[...errors]});
              }
              await page.close();
            }
            for(const width of [360,393,412]){
              const page=await browser.newPage({viewport:{width,height:844},isMobile:true,hasTouch:true});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'load'});
              await page.waitForTimeout(2500);
              const model=await page.evaluate(()=>{const d=window.lifeosTodayAPlusSnapshot();const m=d.metrics;return {mode:document.querySelector('#todayAPlus').dataset.apDataMode,warning:!document.querySelector('#todayAPlus .ap-note').hidden,accounting:Math.abs(m.unique+m.unlogged-m.elapsed)<2&&Math.abs(m.total-m.unique-m.overlap)<2,gaps:Math.abs(d.gaps.reduce((n,g)=>n+g.b-g.a,0)-m.unlogged)<2}});
              for(let i=0;i<4;i++){await page.locator('#apTab'+i).click();await page.screenshot({path:'visual-results/'+width+'-live-'+i+'.png',fullPage:true});}
              results.push({width,mode:'live',model,errors,pass:errors.length===0&&model.mode==='live'&&!model.warning&&model.accounting&&model.gaps});
              await page.close();
            }
            for(const width of [360,393,412]){
              const page=await browser.newPage({viewport:{width,height:844},isMobile:true,hasTouch:true});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              page.on('dialog',d=>d.type()==='prompt'?d.accept('CI gap activity'):d.accept());
              await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'load'});
              await page.waitForTimeout(2000);
              try{
                await page.clock.install({time:new Date(2026,10,24,16,0)});
                const seeded=await page.evaluate(()=>{const f=window.lifeosTodayAPlusAction;const d=window.lifeosTodayAPlusSnapshot();const g=d.gaps.find(g=>g.b-g.a>600000);return g?f('gap',g.a+':'+(g.a+600000)):false});
                if(!seeded)throw Error('Gap seed failed');
                await page.locator('#lifeosNavigation [data-view="tracking"]').click();
                await page.locator('#lifeosNavigation [data-view="dashboard"]').click();
                await page.reload();await page.waitForTimeout(1500);
                const persisted=await page.evaluate(()=>window.lifeosTodayAPlusSnapshot().recorded.some(x=>x.name==='CI gap activity'));
                for(let i=0;i<4;i++){await page.locator('#apTab'+i).click();await page.screenshot({path:'visual-results/'+width+'-populated-'+i+'.png',fullPage:true});}
                results.push({width,mode:'populated',seeded,persisted,errors,pass:seeded&&persisted&&errors.length===0});
              }catch(e){results.push({width,mode:'populated',pass:false,errors:[...errors,String(e)]})}
              await page.close();
            }
            for(const width of [360,393,412]){
              const context=await browser.newContext({viewport:{width,height:844},isMobile:true,hasTouch:true,timezoneId:'Europe/Stockholm'});
              let page=await context.newPage(),errors=[],checks=[];
              const watch=p=>{p.on('pageerror',e=>errors.push(e.message));p.on('dialog',d=>d.type()==='prompt'?d.accept('CI gap resolution'):d.accept())};
              const check=(name,ok)=>{checks.push({name,pass:!!ok});if(!ok)throw Error(name)};
              const url='http://127.0.0.1:8765/index.html';
              const snapshot=()=>page.evaluate(()=>window.lifeosTodayAPlusSnapshot());
              const workspace=()=>page.evaluate(()=>window.lifeosReadOnlyWorkspace());
              const action=(a,id)=>page.evaluate(([a,id])=>window.lifeosTodayAPlusAction(a,id),[a,id]);
              const tab=i=>page.locator('#apTab'+i).click();
              const nav=v=>page.locator('#lifeosNavigation [data-view="'+v+'"]').click();
              try{
                watch(page);
                await page.clock.install({time:new Date('2026-11-24T16:00:00+01:00')});
                await page.addInitScript(()=>{
                  if(localStorage.getItem('ci-integration-seeded'))return;
                  const t=h=>new Date('2026-11-24T00:00:00+01:00').getTime()+h*3600000;
                  const sessions=[['Sleep',0,7],['Prayer',7,7.5],['Breakfast',8,8.5],['University',9,12],['App development',11,12.5],['Lunch',12.5,13],['Security shift',14,15]].map(([name,a,b],i)=>({id:'ci-s'+i,name,status:'finished',startAt:t(a),endAt:t(b),createdAt:t(a),segments:[{start:t(a),end:t(b)}],precision:'measured',notes:''}));
                  const schedule=[['Isha',17.75,18.25],['Arabic practice',19.5,20.5],['Gym',21,21.75]].map(([name,a,b],i)=>({id:'ci-p'+i,name,startAt:t(a),endAt:t(b),createdAt:t(0),status:'planned',sessionId:null,reminder:false,notes:''}));
                  const todos=[{id:'ci-task',name:'Complete assignment preparation',due:'2026-11-24',dueTime:'15:00',timingType:'deadline',priority:'high',category:'University',done:false,createdAt:t(0)}];
                  localStorage.setItem('lifeos-live-v1',JSON.stringify({version:1,sessions,events:[],schedule,todos}));
                  localStorage.setItem('ci-integration-seeded','1');
                });
                await page.goto(url);await page.waitForTimeout(1500);
                let d=await snapshot(),m=d.metrics;
                check('fixture accounting',m.total===14*3600000&&m.unique===13*3600000&&m.overlap===3600000);
                check('gap accounting',Math.abs(m.unlogged-3*3600000)<10000);
                await tab(2);await page.waitForTimeout(1100);
                check('agenda populated',(await page.locator('#apPage2').innerText()).includes('Isha'));
                check('overdue task visible',(await page.locator('#apPage2').innerText()).includes('Complete assignment preparation'));
                check('reminder saved',await action('reminder','ci-p0'));
                check('reminder state',(await workspace()).schedule.find(x=>x.id==='ci-p0').reminder===true);
                check('start planned timer',await action('start-plan','ci-p0'));
                check('start alongside',await action('start-plan','ci-p1'));
                d=await snapshot();const a=d.active.find(x=>x.name==='Isha').id,b=d.active.find(x=>x.name==='Arabic practice').id;
                check('two running timers',d.active.filter(x=>x.status==='running').length===2);
                await page.clock.fastForward(60000);
                check('pause',await action('pause',a));
                const paused=(await snapshot()).active.find(x=>x.id===a).elapsedMs;
                await page.clock.fastForward(60000);
                check('paused clock stable',(await snapshot()).active.find(x=>x.id===a).elapsedMs===paused);
                check('resume',await action('resume',a));
                await page.clock.fastForward(60000);
                await nav('tracking');await page.waitForTimeout(1100);
                check('Track shows active timer',(await page.locator('#loTrackConceptA').innerText()).includes('Isha'));
                const switched=await page.evaluate(id=>{const btn=[...document.querySelectorAll('#sessions [data-act]')].find(x=>x.dataset.id===id&&x.dataset.act==='switch');if(!btn)return false;btn.click();return true},b);
                check('switch control exists',switched);
                await page.waitForTimeout(1100);
                check('switch creates new timer',(await snapshot()).active.some(x=>x.name==='CI gap resolution'));
                await nav('dashboard');
                check('finish',await action('finish',a));
                await page.keyboard.press('Escape');
                const before=await snapshot(),g=before.gaps.find(x=>x.b-x.a>=1800000);
                check('resolve gap',await action('gap',g.a+':'+(g.a+1800000)));
                const after=await snapshot();
                check('gap increases unique time',after.metrics.unique-before.metrics.unique>=1800000);
                check('gap accounting recalculated',Math.abs(after.metrics.unique+after.metrics.unlogged-after.metrics.elapsed)<2);
                await page.reload();await page.waitForTimeout(1500);
                check('refresh persists gap',(await snapshot()).recorded.some(x=>x.name==='CI gap resolution'));
                check('refresh persists reminder',(await workspace()).schedule.find(x=>x.id==='ci-p0').reminder===true);
                const saved=(await workspace()).sessions.map(x=>[x.id,x.status]);
                await page.close();page=await context.newPage();watch(page);
                await page.clock.install({time:new Date('2026-11-24T16:05:00+01:00')});
                await page.goto(url);await page.waitForTimeout(1500);
                check('reopen preserves session identities and states',JSON.stringify((await workspace()).sessions.map(x=>[x.id,x.status]))===JSON.stringify(saved));
                for(let i=0;i<4;i++){await tab(i);await page.screenshot({path:'visual-results/'+width+'-integration-'+i+'.png',fullPage:true});}
                check('no runtime errors',errors.length===0);
              }catch(e){errors.push(String(e))}
              results.push({width,mode:'integration',checks,errors,pass:errors.length===0&&checks.length>=19&&checks.every(x=>x.pass)});
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('visual-results/layout-report.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            if(results.some(r=>!r.pass))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: today-aplus-mobile-visual-results
          path: visual-results/
