name: LifeOS Personal disposable PostgreSQL reliability
on:
  push:
    branches: [main, today-a-plus-rebuild]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifeos_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: lifeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeos_test -d lifeos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LIFEOS_DATABASE_URL: postgresql://lifeos_test:disposable_test_only@localhost:5432/lifeos_test
      LIFEOS_TEST_DISPOSABLE_POSTGRES: '1'
      LIFEOS_TOKEN: disposable-not-real
      LIFEOS_USERNAME: disposable-user
      LIFEOS_PASSWORD: disposable-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify offline Preview target and TLS guards
        run: python -m unittest -v test_preview_target_security
      - name: Install PostgreSQL adapter
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'cryptography>=43,<47' 'pypdf>=5,<7' 'openpyxl>=3.1,<4'
      - name: Install disposable PostgreSQL server and backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16 openssl
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Verify PostgreSQL concurrency, migration, backup and restore in disposable databases
        run: python -m unittest -v test_postgres_persistence_v217 test_preview_migration_postgres
      - name: Verify TLS identity, channel binding and synthetic migration locally
        env:
          LIFEOS_TEST_DISPOSABLE_TLS_POSTGRES: '1'
          LIFEOS_TEST_PG_BINDIR: /usr/lib/postgresql/16/bin
        run: python -m unittest -v test_preview_tls_postgres
      - name: Verify SQLite recovery and deployment regression checks
        run: python -m unittest -v test_stage32 test_stage34 test_stage36_http test_stage37_recovery test_stage40_deployment
