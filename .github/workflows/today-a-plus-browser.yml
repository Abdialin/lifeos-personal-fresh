name: Today A+ browser verification
on:
  push:
    branches: [today-a-plus-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/today-a-plus-browser.cjs
      - run: node tests/today-a-plus-integration.cjs
      - run: node tests/today-v250.cjs
      - run: node tests/today-v250-colors.cjs
      - run: node tests/today-v250-precision.cjs
      - run: node tests/today-v250-volume.cjs
      - run: TODAY_V1_CAPTURE=1 node tests/today-release-v1.cjs
      - run: TODAY_THEME_CAPTURE=1 node tests/today-theme-sync.cjs
      - run: node tests/today-review-categories.cjs
      - run: TODAY_REVIEW_HISTORY_CAPTURE=1 node tests/today-review-history.cjs
      - run: TODAY_AGENDA_CAPTURE=1 node tests/today-agenda-habits.cjs
      - run: TODAY_HISTORY_CAPTURE=1 node tests/today-history-date.cjs
      - run: TRACK_PERIOD_CAPTURE=1 node tests/track-calendar-periods.cjs
      - run: node tests/track-live-controls.cjs
      - run: TRACK_INLINE_CAPTURE=1 node tests/track-inline-timer.cjs
      - run: TRACK_FOCUS_CAPTURE=1 node tests/track-focus-mode.cjs
      - run: TRACK_DETAIL_CAPTURE=1 node tests/track-record-details.cjs
      - run: TRACK_TIMER_CAPTURE=1 node tests/track-timer-settings.cjs
      - run: TRACK_DISTRACTION_CAPTURE=1 node tests/track-distraction-review.cjs
      - run: node test_stage74_accountability.cjs
      - run: node test_stage70_persistence.cjs
      - run: node test_stage75_debt_recovery.cjs
      - run: node test_stage78_duration.cjs
      - run: node test_stage80_duration_profiles.cjs
      - run: node --test test_track_design_v126.test.cjs test_track_focus_v127.test.cjs test_track_polish_v128.test.cjs test_track_visual_v129.test.cjs
      - run: node test_plan_evidence_v250.cjs
      - run: node test_personal_goals_integration.cjs
      - run: node test_goal_fitness_cross_section_v204.cjs
      - run: node test_cross_section_integrity_v206.cjs
      - run: GOALS_READING_CAPTURE=1 node tests/goals-reading-evidence.cjs
      - run: MY_LIFE_CAPTURE=1 node tests/my-life-subsections.cjs
      - run: node tests/plan-overview-model.cjs
      - run: PLAN_OVERVIEW_CAPTURE=1 node tests/plan-overview.cjs
      - run: node tests/plan-concept-a-model.cjs
      - run: PLAN_CAPTURE=1 node tests/plan-concept-a.cjs
      - run: PLAN_CALENDAR_CAPTURE=1 node tests/plan-calendar-sticky.cjs
      - run: PLAN_DST_CAPTURE=1 node tests/plan-calendar-dst.cjs
      - run: PLAN_TASK_CAPTURE=1 node tests/plan-task-editor.cjs
      - run: node tests/plan-task-checkpoint.cjs
      - run: PLAN_COMPARE_CAPTURE=1 node tests/plan-compare-chart.cjs
      - run: node tests/plan-duration-evidence.cjs
      - run: PLAN_IMPROVE_CAPTURE=1 node tests/plan-improve-evidence.cjs
      - run: PLAN_SKIP_CAPTURE=1 node tests/plan-skip-consent.cjs
      - run: SERIES_CAPTURE=1 node tests/plan-series-consent.cjs
      - run: REMINDER_CAPTURE=1 node tests/plan-reminder-skip.cjs
      - run: AUTH_V1_CAPTURE_DIR=authenticated-verification node tests/authenticated-isolated-v1.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: today-a-plus-mobile-screenshots
          path: |
            today-verification/
            plan-verification/
            authenticated-verification/
            docs/design/today/current/release-*.png
            docs/design/track/current/v1-*.png
            docs/design/my-life/current/v1-subsection-*.png
            docs/design/goals/current/release-reading*.png
            docs/design/plan/current/v1-task-editor-*.png
            docs/design/plan/current/v1-compare-*.png
            docs/design/plan/current/v1-improve-*.png
            docs/design/plan/current/v1-calendar-sticky-*.png
            docs/design/plan/current/v1-calendar-dst-*.png
            docs/design/plan/current/v1-skip-*.png
            docs/design/plan/current/v1-series-consent-*.png
            docs/design/plan/current/v1-reminder-*.png
