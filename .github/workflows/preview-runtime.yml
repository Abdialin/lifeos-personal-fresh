name: Preview browser runtime verification
on:
  push:
    branches: [today-a-plus-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Execute Preview browser smoke tests
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:393,height:780},isMobile:true,hasTouch:true});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.route('https://lifeos-today-aplus-preview.onrender.com/**',r=>new URL(r.request().url()).pathname==='/'?r.fulfill({contentType:'text/html',body:fs.readFileSync('index.html','utf8')}):r.fulfill({status:404,body:'offline fixture'}));
              await page.goto('https://lifeos-today-aplus-preview.onrender.com/');
              await page.waitForTimeout(1500);
              assert.equal(await page.locator('#pastForm').count(),1);
              assert.equal(await page.locator('#ap-v248-viewport-script').count(),1);
              assert.equal(await page.locator('body').evaluate(e=>e.classList.contains('ap-preview-viewport')),true);
              const nav=page.locator('#lifeosNavigation');
              assert.equal(await nav.evaluate(e=>getComputedStyle(e).bottom),'0px');
              const track=nav.locator('[data-view="tracking"]');
              await track.click();
              const past=page.getByText(/^\+?\s*Log a past activity$/i).filter({visible:true}).first();
              await past.click({timeout:5000});
              await page.locator('#pastForm').waitFor({state:'visible',timeout:5000});
              assert.deepEqual(errors,[]);
              console.log('PASS: browser startup, mobile nav CSS, Track navigation, manual form opening');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
