name: Preview browser runtime verification
on:
  push:
    branches: [today-a-plus-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Execute Preview browser smoke tests
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:393,height:780},isMobile:true,hasTouch:true});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.route('**/*',r=>{
                const u=new URL(r.request().url());
                const p=u.pathname==='/'?'index.html':u.pathname.slice(1);
                if(u.hostname==='lifeos-today-aplus-preview.onrender.com' && r.request().method()==='GET' && !p.includes('..') && /\.(html|js|css|png|svg|json|webmanifest|ico)$/.test(p) && fs.existsSync(p) && fs.statSync(p).isFile()) return r.fulfill({path:p});
                return r.fulfill({status:404,body:'offline fixture'});
              });
              await page.goto('https://lifeos-today-aplus-preview.onrender.com/');
              await page.waitForTimeout(1500);
              assert.equal(await page.locator('#pastForm').count(),1);
              assert.equal(await page.locator('#ap-v248-viewport-script').count(),1);
              assert.equal(await page.locator('body').evaluate(e=>e.classList.contains('ap-preview-viewport')),true);
              const nav=page.locator('#lifeosNavigation');
              assert.equal(await nav.evaluate(e=>getComputedStyle(e).bottom),'0px');
              const track=nav.locator('[data-view="tracking"]');
              await track.click();
              await page.locator('[data-ca-tab="history"]').click();
              await page.locator('[data-ca-sheet="past"]').click();
              await page.locator('#caPastName').fill('Runtime manual test');
              const local=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
              await page.locator('#caPastStart').fill(local(new Date(Date.now()-3600000)));
              await page.locator('#caPastEnd').fill(local(new Date(Date.now()-1800000)));
              await page.locator('[data-ca-save-past]').click();
              await page.getByText('Activity saved',{exact:true}).waitFor({state:'visible'});
              assert.equal(await page.evaluate(()=>window.lifeosReadOnlyWorkspace().sessions.filter(x=>x.name==='Runtime manual test').length),1);
              await page.reload();
              await page.waitForFunction(()=>typeof window.lifeosReadOnlyWorkspace==='function' && window.lifeosReadOnlyWorkspace().sessions.some(x=>x.name==='Runtime manual test'));
              assert.deepEqual(errors,[]);
              console.log('PASS: manual entry, save confirmation and reload persistence in isolated browser');
            } catch(e) { for(const p of browser.contexts().flatMap(c=>c.pages())) { await p.screenshot({path:'runtime-failure.png',fullPage:true}).catch(()=>{}); fs.writeFileSync('runtime-failure.txt',await p.locator('body').innerText().catch(()=>'')); } throw e; } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-runtime-failure
          path: runtime-failure.*
